services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xyz_retail
      POSTGRES_USER: not_root_user
      POSTGRES_PASSWORD: top_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U not_root_user -d xyz_retail"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/xyz_retail
      SPRING_DATASOURCE_USERNAME: not_root_user
      SPRING_DATASOURCE_PASSWORD: top_secret_password
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://xyz.irfanbilir.nl
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  certbot_www:
  certbot_conf: